<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030814">
<title>Blue Christmas Tree</title>
<style>
  :root { color-scheme: dark; --bg: #030814; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  #error {
    display: none;
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 10;
    margin: 0;
    padding: 12px 14px;
    max-height: 45vh;
    overflow: auto;
    color: #ffb4b4;
    background: rgba(60, 0, 0, 0.72);
    border: 1px solid rgba(255, 120, 120, 0.4);
    border-radius: 8px;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
  }
  #error.visible { display: block; }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="蓝色粒子圣诞树，可拖动旋转"></canvas>
<pre id="error" aria-live="assertive"></pre>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ── 配置 ────────────────────────────────────────────────
  const CONFIG = {
    colors: {
      bg: 0x030814,
      core: 0xdff6ff,
      mid: 0x7cdfff,
      deep: 0x1b5bff,
      accent: 0x4fd1e8,
    },
    tree: { count: 2200, mobileCount: 1200, height: 20, radius: 7.2, baseY: -10 },
    camera: { fov: 40, near: 0.1, far: 220, target: [0, 0.4, 0], radius: 30, pitch: 0.07 },
    fogDensity: 0.018,
    orbit: {
      dragSpeed: 0.004,
      pitchSpeed: 0.003,
      minPitch: -0.14,
      maxPitch: 0.49,
      damping: 0.92,
      autoRotate: 0.06,
      idleAutoRotateAfterMs: 10000,
    },
    tap: { maxMove: 8, maxMs: 350, cooldownMs: 150 },
    burst: { snowflakes: 48, sparks: 24, lifeMin: 1.2, lifeMax: 1.8 },
    bloom: { threshold: 0.78, strength: 0.85, resolution: 0.5 },
    dprCap: 2,
    mobileWidth: 600,
  };

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
  const DEMO = new URLSearchParams(location.search).get('demo');
  const canvas = document.getElementById('stage');
  const errorBox = document.getElementById('error');

  // ── 错误可见化 ───────────────────────────────────────────
  function reportError(message) {
    errorBox.textContent += message + '\n';
    errorBox.classList.add('visible');
  }
  window.addEventListener('error', (e) => {
    reportError('[error] ' + (e.message || e.error || 'unknown'));
  });
  window.addEventListener('unhandledrejection', (e) => {
    reportError('[promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // ── 贴图工具 ───────────────────────────────────────────
  function makeGlowTexture() {
    const size = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.18, 'rgba(205,240,255,0.65)');
    g.addColorStop(0.45, 'rgba(90,175,255,0.18)');
    g.addColorStop(1.0, 'rgba(20,60,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function makeFlareTexture() {
    const size = 512;
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const half = size / 2;

    const halo = ctx.createRadialGradient(half, half, 0, half, half, half);
    halo.addColorStop(0.0, 'rgba(255,255,255,1)');
    halo.addColorStop(0.05, 'rgba(235,252,255,0.95)');
    halo.addColorStop(0.16, 'rgba(140,215,255,0.35)');
    halo.addColorStop(0.45, 'rgba(45,120,255,0.08)');
    halo.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, size, size);

    ctx.globalCompositeOperation = 'lighter';
    const ray = (angle, length, width, alpha) => {
      ctx.save();
      ctx.translate(half, half);
      ctx.rotate(angle);
      const g = ctx.createLinearGradient(0, 0, 0, -length);
      g.addColorStop(0.0, 'rgba(255,255,255,' + alpha + ')');
      g.addColorStop(0.3, 'rgba(190,240,255,' + alpha * 0.45 + ')');
      g.addColorStop(1.0, 'rgba(120,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-width, 0);
      ctx.lineTo(0, -length);
      ctx.lineTo(width, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };
    ray(0, 245, 5.5, 0.95);
    ray(Math.PI, 245, 5.5, 0.95);
    ray(Math.PI / 2, 245, 5.5, 0.95);
    ray(-Math.PI / 2, 245, 5.5, 0.95);
    ray(Math.PI / 4, 105, 3.2, 0.55);
    ray(-Math.PI / 4, 105, 3.2, 0.55);
    ray((Math.PI * 3) / 4, 105, 3.2, 0.55);
    ray((-Math.PI * 3) / 4, 105, 3.2, 0.55);

    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // ── 粒子树 ──────────────────────────────────────────────
  function createTree(count) {
    const { height, radius, baseY } = CONFIG.tree;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);
    const cCore = new THREE.Color(CONFIG.colors.core);
    const cMid = new THREE.Color(CONFIG.colors.mid);
    const cDeep = new THREE.Color(CONFIG.colors.deep);
    const cAccent = new THREE.Color(CONFIG.colors.accent);
    const col = new THREE.Color();
    const golden = Math.PI * (3 - Math.sqrt(5));

    for (let i = 0; i < count; i++) {
      const up = Math.random();                       // 0 底部 → 1 顶部
      const y = baseY + height * up + (Math.random() - 0.5) * 0.28;
      const coneR = radius * (1 - up);
      const shell = Math.random() < 0.82 ? 0.9 + Math.random() * 0.1 : 0.35 + Math.random() * 0.45;
      const r = coneR * shell;
      const a = i * golden + up * 2.2;
      positions[i * 3] = Math.cos(a) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(a) * r;

      if (up < 0.55) col.copy(cDeep).lerp(cMid, up / 0.55);
      else col.copy(cMid).lerp(cCore, (up - 0.55) / 0.45);
      if (Math.random() < 0.06) col.copy(cAccent);
      col.multiplyScalar(0.75 + Math.random() * 0.55);
      colors[i * 3] = col.r;
      colors[i * 3 + 1] = col.g;
      colors[i * 3 + 2] = col.b;

      let s = 0.9 + Math.random() * 1.5;
      if (Math.random() < 0.06) s *= 2.3;
      sizes[i] = s;
      phases[i] = Math.random();
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

    const uniforms = {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer ? renderer.getPixelRatio() : 1 },
      uFogDensity: { value: CONFIG.fogDensity },
      uRippleOrigin: { value: new THREE.Vector3(0, 0, 0) },
      uRippleTime: { value: -1 },
      uDim: { value: 1 },
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uFogDensity;
        uniform vec3 uRippleOrigin;
        uniform float uRippleTime;
        uniform float uDim;
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aPhase;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float twinkle = 0.7 + 0.3 * sin(uTime * 1.5 + aPhase * 6.28318);
          float ring = 0.0;
          if (uRippleTime >= 0.0) {
            float d = distance(position, uRippleOrigin);
            float wave = uRippleTime * 9.0;
            ring = exp(-pow((d - wave) * 1.15, 2.0)) * max(0.0, 1.0 - uRippleTime * 0.55);
          }
          float fog = exp(-uFogDensity * uFogDensity * mv.z * mv.z);
          vColor = aColor * (0.62 + 0.55 * twinkle) + vec3(0.45, 0.8, 1.0) * ring * 1.7;
          vColor *= fog * uDim;
          vAlpha = 0.55 + 0.45 * twinkle;
          gl_PointSize = aSize * uPixelRatio * (118.0 / max(-mv.z, 0.001));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p) * 2.0;
          float a = smoothstep(1.0, 0.0, d);
          a *= a;
          gl_FragColor = vec4(vColor, a * vAlpha);
        }
      `,
    });

    const group = new THREE.Group();
    const points = new THREE.Points(geo, material);
    group.add(points);

    function triggerRipple(worldPos) {
      group.updateMatrixWorld(true);
      const local = group.worldToLocal(worldPos.clone());
      uniforms.uRippleOrigin.value.copy(local);
      uniforms.uRippleTime.value = 0;
    }

    return { group, uniforms, triggerRipple };
  }

  // ── 挂饰 ────────────────────────────────────────────────
  function createOrnaments() {
    const { height, radius, baseY } = CONFIG.tree;
    const group = new THREE.Group();
    const glow = makeGlowTexture();
    const geo = new THREE.SphereGeometry(1, 12, 12);
    const palette = [CONFIG.colors.core, CONFIG.colors.accent, CONFIG.colors.mid];
    const materials = palette.map((c) => new THREE.MeshBasicMaterial({ color: c, fog: false }));
    const haloMaterial = new THREE.SpriteMaterial({
      map: glow,
      color: CONFIG.colors.mid,
      transparent: true,
      opacity: 0.42,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false,
    });
    const items = [];

    for (let i = 0; i < 30; i++) {
      const up = 0.06 + Math.random() * 0.86;
      const a = Math.random() * Math.PI * 2;
      const r = radius * (1 - up) * 1.01;
      const y = baseY + height * up;
      const scale = 0.09 + Math.random() * 0.1;

      const mesh = new THREE.Mesh(geo, materials[i % materials.length]);
      mesh.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
      mesh.scale.setScalar(scale);
      group.add(mesh);

      const halo = new THREE.Sprite(haloMaterial);
      halo.position.copy(mesh.position);
      halo.scale.setScalar(scale * (6.5 + Math.random() * 3.5));
      group.add(halo);

      items.push({
        mesh,
        halo,
        baseY: y,
        phase: Math.random() * 6.28,
        pulse: 0,
        baseScale: scale,
        baseHalo: scale * (6.5 + Math.random() * 3.5),
      });
    }

    return {
      group,
      items,
      update(t, dt) {
        for (const it of items) {
          it.mesh.position.y = it.baseY + Math.sin(t * 0.6 + it.phase) * 0.16;
          it.halo.position.y = it.mesh.position.y;
          if (it.pulse > 0) {
            it.pulse = Math.max(0, it.pulse - dt / 0.8);
            const k = 1 + 0.9 * it.pulse;
            it.mesh.scale.setScalar(it.baseScale * k);
            it.halo.scale.setScalar(it.baseHalo * k);
          }
        }
      },
      pulse(worldPos) {
        for (const it of items) {
          if (it.mesh.position.distanceTo(worldPos) < 3.2) it.pulse = 1;
        }
      },
    };
  }

  // ── 树顶星 ──────────────────────────────────────────────
  function createStar() {
    const group = new THREE.Group();
    group.position.set(0, CONFIG.tree.baseY + CONFIG.tree.height + 0.7, 0);
    const flare = makeFlareTexture();

    const core = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.55, 0),
      new THREE.MeshBasicMaterial({ color: 0xf2fdff, fog: false })
    );
    group.add(core);

    const flareSprite = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: flare,
        color: 0xdff6ff,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false,
      })
    );
    flareSprite.scale.setScalar(8);
    group.add(flareSprite);

    const halo = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        color: 0xbfefff,
        transparent: true,
        opacity: 0.8,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fog: false,
      })
    );
    halo.scale.setScalar(3.4);
    group.add(halo);

    let flashT = -1;
    return {
      group,
      flash() { flashT = 0; },
      update(t, dt) {
        const breathe = 1 + 0.06 * Math.sin(t * 1.2);
        let boost = 1;
        if (flashT >= 0) {
          flashT += dt;
          boost = 1 + Math.max(0, 1 - flashT / 0.25) * 1.5;
          if (flashT > 0.3) flashT = -1;
        }
        flareSprite.scale.setScalar(8 * breathe * boost);
        halo.scale.setScalar(3.4 * breathe * (1 + (boost - 1) * 0.5));
        core.rotation.y = t * 0.4;
        core.rotation.x = Math.sin(t * 0.3) * 0.25;
      },
    };
  }

  // ── 地面光池 ────────────────────────────────────────────
  function createGround() {
    const geo = new THREE.CircleGeometry(18, 64);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uColor: { value: new THREE.Color(0x1550c8) },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying vec2 vUv;
        void main() {
          float d = length(vUv - 0.5) * 2.0;
          float a = smoothstep(1.0, 0.0, d);
          a = pow(a, 2.6);
          gl_FragColor = vec4(uColor * (0.32 + 0.68 * a), a * 0.22);
        }
      `,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = CONFIG.tree.baseY - 0.12;
    return { mesh, mat };
  }

  // ── 背景极光 ────────────────────────────────────────────
  function createAurora() {
    const geo = new THREE.PlaneGeometry(200, 110);
    const uniforms = {
      uTime: { value: 0 },
      uColorA: { value: new THREE.Color(0x1b5bff) },
      uColorB: { value: new THREE.Color(0x4fd1e8) },
      uIntensity: { value: 0.3 },
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        uniform float uIntensity;
        varying vec2 vUv;

        float band(vec2 uv, float t, float freq, float speed, float center) {
          float y = uv.y + 0.10 * sin(uv.x * freq + t * speed)
                         + 0.035 * sin(uv.x * freq * 2.3 - t * speed * 0.6);
          float d = (y - center) * 8.0;
          return exp(-d * d);
        }

        void main() {
          float t = uTime * 0.16;
          float a = band(vUv, t, 3.1, 0.8, 0.60);
          float b = band(vUv, t, 2.2, -0.55, 0.70);
          float c = band(vUv, t * 1.3, 4.6, 1.1, 0.52);
          float glow = a * 0.55 + b * 0.42 + c * 0.3;

          float shimmer = 0.72 + 0.28 * sin(vUv.x * 9.0 + t * 2.2);
          float edge = smoothstep(0.0, 0.14, vUv.x) * smoothstep(1.0, 0.86, vUv.x);
          edge *= smoothstep(0.08, 0.3, vUv.y) * smoothstep(1.0, 0.72, vUv.y);

          vec3 col = mix(uColorA, uColorB, clamp(vUv.y * 0.9 + 0.15 * sin(vUv.x * 2.0 + t), 0.0, 1.0));
          gl_FragColor = vec4(col * glow * shimmer * uIntensity, glow * edge * 0.22);
        }
      `,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 18, -70);
    mesh.renderOrder = -10;
    mesh.frustumCulled = false;
    return {
      mesh,
      update(t) { uniforms.uTime.value = t; },
    };
  }

  // ── 远景星点 ────────────────────────────────────────────
  function createStars() {
    const count = 180;
    const positions = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const r = 80 + Math.random() * 30;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
      positions[i * 3 + 1] = Math.cos(phi) * r * 0.7 + 6;
      positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * r;
      sizes[i] = 0.6 + Math.random() * 1.4;
      phases[i] = Math.random() * 6.28;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: 1 } },
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        attribute float aSize;
        attribute float aPhase;
        varying float vAlpha;
        void main() {
          vAlpha = 0.22 + 0.2 * sin(uTime * 0.7 + aPhase);
          gl_PointSize = aSize * uPixelRatio;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.0, length(p));
          gl_FragColor = vec4(vec3(0.75, 0.87, 1.0), a * vAlpha);
        }
      `,
    });
    const points = new THREE.Points(geo, mat);
    points.renderOrder = -9;
    points.frustumCulled = false;
    return {
      object: points,
      uniforms: mat.uniforms,
      update(t) { mat.uniforms.uTime.value = t; },
    };
  }

  // ── 3D 雪 ───────────────────────────────────────────────
  function createSnow(count) {
    const positions = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);
    const speeds = new Float32Array(count);
    const drift = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 38;
      positions[i * 3 + 1] = -14 + Math.random() * 32;
      positions[i * 3 + 2] = -16 + Math.random() * 36;
      sizes[i] = 0.6 + Math.random() * 1.7;
      phases[i] = Math.random() * 6.28;
      speeds[i] = 0.35 + Math.random() * 0.95;
      drift[i] = 0.5 + Math.random() * 1.2;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

    const uniforms = {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer ? renderer.getPixelRatio() : 1 },
    };
    const mat = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float uTime;
        uniform float uPixelRatio;
        attribute float aSize;
        attribute float aPhase;
        varying float vAlpha;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * uPixelRatio * (88.0 / max(-mv.z, 1.0));
          vAlpha = 0.38 + 0.35 * (0.5 + 0.5 * sin(uTime * 1.1 + aPhase * 6.28318));
          vAlpha *= exp(-0.00022 * mv.z * mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.0, length(p));
          a *= a;
          gl_FragColor = vec4(vec3(0.78, 0.9, 1.0), a * vAlpha);
        }
      `,
    });

    const object = new THREE.Points(geo, mat);
    object.frustumCulled = false;
    const stir = new THREE.Vector2();

    return {
      object,
      uniforms,
      stir(v) { stir.x += v.x * 0.04; stir.y += v.y * 0.04; },
      update(dt, t) {
        if (reducedMotion) return;
        stir.multiplyScalar(Math.pow(0.94, dt * 60));
        const arr = positions;
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          arr[i3 + 1] -= speeds[i] * dt;
          arr[i3] += (Math.sin(t * 0.5 + phases[i]) * 0.12 + stir.x * drift[i]) * dt;
          arr[i3 + 2] += stir.y * drift[i] * dt;

          if (arr[i3 + 1] < -14) {
            arr[i3 + 1] = 18;
            arr[i3] = (Math.random() - 0.5) * 38;
            arr[i3 + 2] = -16 + Math.random() * 36;
          }
          if (arr[i3] > 20) arr[i3] = -20;
          if (arr[i3] < -20) arr[i3] = 20;
          if (arr[i3 + 2] > 20) arr[i3 + 2] = -16;
          if (arr[i3 + 2] < -16) arr[i3 + 2] = 20;
        }
        geo.attributes.position.needsUpdate = true;
        uniforms.uTime.value = t;
      },
    };
  }

  // ── 泛光与最终合成 ──────────────────────────────────────
  function createBloom() {
    const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadScene = new THREE.Scene();
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
    quadScene.add(quad);

    const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
    const rtScene = new THREE.WebGLRenderTarget(1, 1, Object.assign({ depthBuffer: true }, rtOpts));
    const rtBright = new THREE.WebGLRenderTarget(1, 1, Object.assign({ depthBuffer: false }, rtOpts));
    const rtBlurA = new THREE.WebGLRenderTarget(1, 1, Object.assign({ depthBuffer: false }, rtOpts));
    const rtBlurB = new THREE.WebGLRenderTarget(1, 1, Object.assign({ depthBuffer: false }, rtOpts));

    const vert = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const brightMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rtScene.texture },
        uThreshold: { value: CONFIG.bloom.threshold },
      },
      vertexShader: vert,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uThreshold;
        varying vec2 vUv;
        void main() {
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          float k = smoothstep(uThreshold, uThreshold + 0.22, l);
          gl_FragColor = vec4(c * k, 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false,
    });

    const blurMat = (source, dir) => new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: source },
        uDir: { value: new THREE.Vector2(0, 0) },
      },
      vertexShader: vert,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 uDir;
        varying vec2 vUv;
        void main() {
          vec3 sum = texture2D(tDiffuse, vUv).rgb * 0.227027027;
          sum += (texture2D(tDiffuse, vUv + uDir * 1.3846153846).rgb +
                  texture2D(tDiffuse, vUv - uDir * 1.3846153846).rgb) * 0.3162162162;
          sum += (texture2D(tDiffuse, vUv + uDir * 3.2307692308).rgb +
                  texture2D(tDiffuse, vUv - uDir * 3.2307692308).rgb) * 0.0702702703;
          gl_FragColor = vec4(sum, 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false,
    });

    const blurMatH = blurMat(rtBright.texture);
    const blurMatV = blurMat(rtBlurA.texture);

    const compositeMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: rtScene.texture },
        tBloom: { value: rtBlurB.texture },
        uBloom: { value: CONFIG.bloom.strength },
        uTime: { value: 0 },
      },
      vertexShader: vert,
      fragmentShader: `
        uniform sampler2D tScene;
        uniform sampler2D tBloom;
        uniform float uBloom;
        uniform float uTime;
        varying vec2 vUv;

        vec3 aces(vec3 x) {
          return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
        }
        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        void main() {
          vec3 base = texture2D(tScene, vUv).rgb;
          vec3 glow = texture2D(tBloom, vUv).rgb;
          vec3 color = base + glow * uBloom;
          color = aces(color * 1.08);
          float vig = smoothstep(1.05, 0.25, length(vUv - 0.5));
          color *= mix(0.55, 1.0, vig);
          color += (hash(vUv * vec2(1733.0, 977.0) + uTime * 0.4) - 0.5) * 0.006;
          color = max(color, 0.0);
          vec3 srgb = mix(color * 12.92, 1.055 * pow(color, vec3(1.0 / 2.4)) - 0.055,
                          step(vec3(0.0031308), color));
          gl_FragColor = vec4(srgb, 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false,
    });

    let width = 1;
    let height = 1;

    function resize(w, h) {
      const pr = renderer.getPixelRatio();
      width = Math.max(1, Math.floor(w * pr));
      height = Math.max(1, Math.floor(h * pr));
      rtScene.setSize(width, height);
      const bw = Math.max(1, Math.floor(width * CONFIG.bloom.resolution));
      const bh = Math.max(1, Math.floor(height * CONFIG.bloom.resolution));
      rtBright.setSize(bw, bh);
      rtBlurA.setSize(bw, bh);
      rtBlurB.setSize(bw, bh);
      blurMatH.uniforms.uDir.value.set(1 / bw, 0);
      blurMatV.uniforms.uDir.value.set(0, 1 / bh);
    }

    function pass(material, target) {
      quad.material = material;
      renderer.setRenderTarget(target);
      renderer.render(quadScene, quadCamera);
    }

    function render(t) {
      renderer.setRenderTarget(rtScene);
      renderer.clear();
      renderer.render(scene, camera);
      pass(brightMat, rtBright);
      pass(blurMatH, rtBlurA);
      pass(blurMatV, rtBlurB);
      compositeMat.uniforms.uTime.value = t;
      pass(compositeMat, null);
    }

    return { resize, render };
  }

  // ── 纯逻辑（可被 Node 测试提取） ────────────────────────
  // #region logic
  function isTap(dx, dy, dtMs, limits) {
    return Math.hypot(dx, dy) < limits.maxMove && dtMs < limits.maxMs;
  }
  // #endregion logic

  // ── 轨道相机 ────────────────────────────────────────────
  function createOrbit(dom, camera, target) {
    const o = CONFIG.orbit;
    const state = {
      yaw: 0,
      pitch: CONFIG.camera.pitch,
      vYaw: 0,
      vPitch: 0,
      dragging: false,
      pointerId: null,
      lastX: 0,
      lastY: 0,
      dragX: 0,
      dragY: 0,
      lastInteraction: performance.now(),
    };

    const clampPitch = (v) => Math.min(o.maxPitch, Math.max(o.minPitch, v));

    function onDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      state.dragging = true;
      state.pointerId = e.pointerId;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.vYaw = 0;
      state.vPitch = 0;
      state.dragX = 0;
      state.dragY = 0;
      state.lastInteraction = performance.now();
      dom.classList.add('dragging');
      try { dom.setPointerCapture(e.pointerId); } catch (_) {}
    }

    function onMove(e) {
      if (!state.dragging || e.pointerId !== state.pointerId) return;
      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.dragX += dx;
      state.dragY += dy;
      state.yaw -= dx * o.dragSpeed;
      state.pitch = clampPitch(state.pitch + dy * o.pitchSpeed);
      state.vYaw = -dx * o.dragSpeed * 0.9;
      state.vPitch = dy * o.pitchSpeed * 0.9;
      state.lastInteraction = performance.now();
    }

    function onUp(e) {
      if (e.pointerId !== state.pointerId) return;
      state.dragging = false;
      state.pointerId = null;
      state.lastInteraction = performance.now();
      dom.classList.remove('dragging');
      try { dom.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    dom.addEventListener('pointerdown', onDown);
    dom.addEventListener('pointermove', onMove);
    dom.addEventListener('pointerup', onUp);
    dom.addEventListener('pointercancel', onUp);
    dom.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
    dom.addEventListener('contextmenu', (e) => e.preventDefault());

    return {
      target,
      isDragging() { return state.dragging; },
      consumeDragDelta() {
        const d = { x: state.dragX, y: state.dragY };
        state.dragX = 0;
        state.dragY = 0;
        return d;
      },
      update(dt, now) {
        if (!state.dragging) {
          const decay = Math.pow(o.damping, dt * 60);
          state.yaw += state.vYaw * dt * 60;
          state.pitch = clampPitch(state.pitch + state.vPitch * dt * 60);
          state.vYaw *= decay;
          state.vPitch *= decay;
          if (Math.abs(state.vYaw) < 0.0002) state.vYaw = 0;
          if (Math.abs(state.vPitch) < 0.0002) state.vPitch = 0;

          if (!reducedMotion && now - state.lastInteraction > o.idleAutoRotateAfterMs) {
            state.yaw += o.autoRotate * dt;
          }
        }
        const r = CONFIG.camera.radius;
        const cp = Math.cos(state.pitch);
        camera.position.set(
          target.x + Math.sin(state.yaw) * cp * r,
          target.y + Math.sin(state.pitch) * r,
          target.z + Math.cos(state.yaw) * cp * r
        );
        camera.lookAt(target);
      },
    };
  }

  // ── 渲染基础 ────────────────────────────────────────────
  let renderer, scene, camera, clock;
  let framesRendered = 0;
  let elapsed = 0;
  let tree, ornaments, star, ground, orbit;
  let aurora, stars, snow, bloom;

  function computeFraming() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    const halfV = Math.tan(THREE.MathUtils.degToRad(CONFIG.camera.fov / 2));
    const fitW = (CONFIG.tree.radius * 1.16) / (halfV * aspect);
    const radius = Math.max(40, fitW);
    const targetY = aspect < 0.8 ? -2.2 : -1.2;
    return { radius, targetY };
  }

  function buildWorld() {
    const cores = navigator.hardwareConcurrency || 8;
    const small = window.innerWidth < CONFIG.mobileWidth || coarsePointer;
    let count = small ? CONFIG.tree.mobileCount : CONFIG.tree.count;
    if (cores <= 4) count = Math.round(count * 0.75);

    scene.fog = new THREE.FogExp2(CONFIG.colors.bg, CONFIG.fogDensity);

    aurora = createAurora();
    scene.add(aurora.mesh);
    stars = createStars();
    scene.add(stars.object);

    tree = createTree(count);
    scene.add(tree.group);
    ornaments = createOrnaments();
    scene.add(ornaments.group);
    star = createStar();
    scene.add(star.group);
    ground = createGround();
    scene.add(ground.mesh);

    orbit = createOrbit(canvas, camera, new THREE.Vector3(0, CONFIG.camera.target[1], 0));

    snow = createSnow(small ? 240 : 460);
    scene.add(snow.object);
  }

  function init() {
    if (!window.THREE) {
      reportError('Three.js 未加载：请确认 vendor/three.min.js 存在。');
      return;
    }

    try {
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance',
      });
    } catch (err) {
      reportError('当前浏览器不支持 WebGL，无法显示 3D 场景。');
      return;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.dprCap));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setClearColor(CONFIG.colors.bg, 1);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.colors.bg);

    const cam = CONFIG.camera;
    const framing = computeFraming();
    cam.radius = framing.radius;
    cam.target = [0, framing.targetY, 0];

    camera = new THREE.PerspectiveCamera(cam.fov, window.innerWidth / window.innerHeight, cam.near, cam.far);
    const pitch = CONFIG.camera.pitch;
    camera.position.set(
      cam.target[0],
      cam.target[1] + Math.sin(pitch) * cam.radius,
      Math.cos(pitch) * cam.radius
    );
    camera.lookAt(cam.target[0], cam.target[1], cam.target[2]);

    clock = new THREE.Clock();
    buildWorld();

    if ((navigator.hardwareConcurrency || 8) <= 4 || window.innerWidth < 500) {
      CONFIG.bloom.resolution = 0.4;
    }
    try {
      bloom = createBloom();
    } catch (err) {
      bloom = null;
      console.warn('Bloom 不可用，回退到直接渲染：', err);
    }

    resize();
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && clock) clock.getDelta();
    });

    animate();
  }

  function resize() {
    if (!renderer || !camera) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.dprCap));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (tree) tree.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    if (snow) snow.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    if (stars) stars.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    if (bloom) bloom.resize(w, h);
    if (orbit) {
      const framing = computeFraming();
      CONFIG.camera.radius = framing.radius;
      orbit.target.set(0, framing.targetY, 0);
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    if (document.hidden) return;

    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (tree) {
      tree.uniforms.uTime.value = elapsed;
      if (tree.uniforms.uRippleTime.value >= 0) {
        tree.uniforms.uRippleTime.value += dt;
        if (tree.uniforms.uRippleTime.value > 2.4) tree.uniforms.uRippleTime.value = -1;
      }
    }
    if (ornaments) ornaments.update(elapsed, dt);
    if (star) star.update(elapsed, dt);
    if (orbit) orbit.update(dt, performance.now());
    if (aurora) aurora.update(reducedMotion ? 0 : elapsed);
    if (stars) stars.update(reducedMotion ? 0 : elapsed);
    if (snow) snow.update(dt, elapsed);

    if (bloom) bloom.render(elapsed);
    else renderer.render(scene, camera);

    framesRendered++;
    if (framesRendered === 3) {
      window.SCENE_READY = true;
      document.documentElement.dataset.ready = '1';
    }
  }

  // 供后续任务与调试使用
  window.BCT = {
    CONFIG,
    DEMO,
    reducedMotion,
    coarsePointer,
    get tree() { return tree; },
    get ornaments() { return ornaments; },
    get star() { return star; },
    get orbit() { return orbit; },
    get snow() { return snow; },
    get bloom() { return bloom; },
    get scene() { return scene; },
    get camera() { return camera; },
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
